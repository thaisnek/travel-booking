server:
  port: 8080
  servlet:
    context-path: /ltweb

paypal:
  client:
    id: ${PAYPAL_CLIENT_ID}
    secret: ${PAYPAL_CLIENT_SECRET}
  mode: ${PAYPAL_MODE:sandbox}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/travel}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    protocol: smtp

avatar:
  upload:
    dir: ${AVATAR_UPLOAD_DIR:C:/Users/Dinh Thai/Documents/images/avatar}

tour:
  upload:
    dir: ${TOUR_UPLOAD_DIR:C:/Users/Dinh Thai/Documents/images/tour}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  backend-url: ${BACKEND_URL:http://localhost:8080/ltweb}
  flask-api-url: ${FLASK_API_URL:http://127.0.0.1:5555}

booking:
  pending-expiration-minutes: ${BOOKING_PENDING_EXPIRATION_MINUTES:30}
  pending-expiration-check-ms: ${BOOKING_PENDING_EXPIRATION_CHECK_MS:60000}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION:86400000}
